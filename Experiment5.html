<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Student Registration Form</h1></center><hr>
    <label for="name">Full Name:</label>
    <input type="text" name="name" placeholder="Enter Your Name"><br>
    
    <label for="Email">Email:</label>
    <input type="Email" name="Email" placeholder="Enter your Email"><br>

     <label for="password">Password:</label>
    <input type="password" name="password" placeholder="Enter your Password"><br>

    <label for="gen">Gender:</label>
        <input type="radio" name="gender" id="male"></input>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female"></input>
        <label for="female">Female</label>
        <Input type="radio" name="gender" id="Other"></input>
        <label for="other">Other</label><BR>
     Course:
        <select name="lang" id="lang">
        <option>-- Select Course --</option>
        <option>Btech</option>
        <option>Bca</option>
        <option>BSc</option></select>
        <BR>
    Contact No:
    <input type="number" name="contact" placeholder="Enter Phone Number"><br>
    Address:
    <textarea name="address" id="address" cols="300" rows="5" placeholder="Enter Your Address"></textarea>
    <input type="submit" value="Register">
    <input type="submit" value="clear">
    <hr>
    <center>&copy; 2025 Student Registration Portal</center>


    




</body>
</html>
